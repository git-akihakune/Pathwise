x-app-env: &app-env
  APP_URL: ${APP_URL:-http://localhost:3000}
  DATABASE_URL: postgres://pathwise:${POSTGRES_PASSWORD:-pathwise}@postgres:5432/pathwise
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-}
  CUSTOM_ENDPOINTS: ${CUSTOM_ENDPOINTS:-admin_only}
  ALLOW_PRIVATE_ENDPOINTS: ${ALLOW_PRIVATE_ENDPOINTS:-false}
  LLM_MODE: ${LLM_MODE:-live}
  TAXONOMY_DIR: ${TAXONOMY_DIR:-/app/data/taxonomy}
  SEED_DEMO: ${SEED_DEMO:-false}
  LOG_CONTENT: ${LOG_CONTENT:-false}
  LOG_LEVEL: ${LOG_LEVEL:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-app: &app
  build: .
  image: pathwise:local
  environment: *app-env

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: pathwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pathwise}
      POSTGRES_DB: pathwise
    volumes:
      - pathwise-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathwise -d pathwise"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  init:
    <<: *app
    command: ["init"]
    volumes:
      - pathwise-secrets:/var/lib/pathwise/secrets
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    command: ["web"]
    ports: ["${PATHWISE_PORT:-3000}:3000"]
    volumes:
      - pathwise-secrets:/var/lib/pathwise/secrets
      - pathwise-files:/var/lib/pathwise/files
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    <<: *app
    command: ["worker"]
    volumes:
      - pathwise-secrets:/var/lib/pathwise/secrets
      - pathwise-files:/var/lib/pathwise/files
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "pathwise", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pathwise-db:
  pathwise-files:
  pathwise-secrets:
