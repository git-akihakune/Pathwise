services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: pathwise
      POSTGRES_PASSWORD: pathwise
      POSTGRES_DB: pathwise
    ports: ["5432:5432"]
    volumes:
      - pathwise-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathwise -d pathwise"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pathwise-dev-db:
